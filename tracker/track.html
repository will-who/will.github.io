<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation -->
    <header class="topbar">

        <div class="logo">
            ◉
        </div>

        <div class="arrows">
            <button>←</button>
            <button>→</button>
        </div>

        <nav>
            <a href="#">HOME</a>
            <a href="#" class="active">GAMES</a>
            <a href="#">FRIENDS</a>
            <a href="#">GLOBAL CHATROOM</a>
        </nav>

        <div class="notification">
            🕭
        </div>

    </header>


    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="search">
                <input type="text" placeholder="Search games">
                <span>⌕</span>
            </div>

            <div class="menu">

                <div class="menu-item selected">
                    <span>Your Library</span>
                    <small>3</small>
                </div>

                <div class="menu-item">
                    <span>Installed</span>
                    <small>1</small>
                </div>

                <div class="menu-item">
                    <span>Favorites</span>
                    <small>1</small>
                </div>

                <hr>

                <div class="menu-item">
                    <span>All Our Games</span>
                    <small>36</small>
                </div>
            </div>
        </aside>


        <!-- Main Content -->
        <main class="content">

            <div class="content-header">
                <h1>Your Games</h1>

                <div class="sort">
                    Sort by:
                    <button>Last Played⌄</button>
                </div>
            </div>




            <!-- Game Cards -->
            <div class="games">

                <div class="game-card">

                    <div class="game-image overwatch">
                        <span class="star">★</span>
                        <div class="game-title">OVERWATCH</div>
                    </div>

                    <h3>Overwatch</h3>

                    <div class="installed">
                        <span>✓</span> Installed
                    </div>

                </div>


                <div class="game-card">

                    <div class="game-image sea">
                        <span class="star empty">☆</span>
                        <div class="game-title">MARVEL<br>RIVALS</div>
                    </div>

                    <h3>Marverl Rivals</h3>

                    <p>First person shooter</p>

                </div>

            </div>

        </main>

    </div>

</body>
</html>
